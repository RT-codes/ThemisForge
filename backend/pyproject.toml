[project]
name = "backend"
version = "0.3.0"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# On top of ruff's defaults: likely bugs (B), modern syntax (UP), simplifications (SIM, C4, RET).
# PTH (use pathlib) is left out on purpose: os.replace/os.rename for atomic writes and
# os.symlink in the cell and workflow code are clearer than their Path twins.
extend-select = ["B", "UP", "SIM", "C4", "RET"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
