name: CI

# Every push to main and every pull request: lint and test the backend (on Linux, and on Windows without blocking
# until Windows is supported), then check, test and build the web interface.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is not supported yet: its results are shown, but a failure there does not block a merge
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts --config pyproject.toml
      - run: uv run ruff format --check . ../scripts --config pyproject.toml
      - run: uv run pytest -q

  frontend:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  bundle:
    name: Release bundle builds
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build
      # proves the bundle can be built on every change, and that it installs and starts from nothing
      - run: python3 scripts/build_release.py --out dist
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install and start the bundle
        run: |
          mkdir smoke && tar -xzf dist/themisforge-*.tar.gz -C smoke
          cd smoke/themisforge-*/backend
          uv sync --no-dev --frozen
          THEMIS_CELL_BACKEND=fake THEMIS_DATABASE_URL="sqlite+aiosqlite:///$PWD/smoke.db" THEMIS_DATA_DIR="$PWD/data" \
            .venv/bin/uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/version
          curl -fsS localhost:8000/ | grep -qi "<html"
