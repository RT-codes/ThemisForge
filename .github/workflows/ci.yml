name: CI

# Every push to main and every pull request: lint and test the backend (on Linux, and on Windows without blocking
# until Windows is supported), then check, test and build the web interface.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is not supported yet: its results are shown, but a failure there does not block a merge
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts --config pyproject.toml
      - run: uv run ruff format --check . ../scripts --config pyproject.toml
      - run: uv run pytest -q

  frontend:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  bundle:
    name: Release bundle builds
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build
      # proves the bundle can be built on every change, and that it installs and starts from nothing
      - run: python3 scripts/build_release.py --out dist
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install the bundle with the real installer and start it
        # the real installer code path (themisctl.py install --bundle): checks Docker, writes the settings, links the
        # release, makes the `themis` command. Only the downloads, the agent image and the system service are left out.
        run: |
          export HOME="$RUNNER_TEMP/home" THEMIS_HOME="$RUNNER_TEMP/themis"
          mkdir -p "$HOME"
          python3 scripts/themisctl.py install --bundle dist/themisforge-*.tar.gz --no-service --skip-image --yes --port 8000
          "$HOME/.local/bin/themis" status
          "$HOME/.local/bin/themis" run &
          for i in $(seq 1 40); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/version
          curl -fsS localhost:8000/ | grep -qi "<html"
          "$HOME/.local/bin/themis" doctor
          "$HOME/.local/bin/themis" backup

  windows-install:
    name: Install on Windows
    needs: frontend
    runs-on: windows-latest
    # Windows is new: its install is shown here, but a failure does not block a merge until it has been green for a while.
    continue-on-error: true
    env:
      # GitHub's Windows runners run Windows containers only, so cells are simulated here; everything else is the real thing
      THEMIS_CELL_BACKEND: fake
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: cd frontend; npm ci --no-audit --no-fund; npm run build
      - run: python scripts/build_release.py --out dist
      - name: Install the bundle with the real installer
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem dist\themisforge-*.tar.gz).FullName
          python scripts/themisctl.py --home "$env:RUNNER_TEMP\Themis" install --bundle $bundle --no-service --skip-image --yes --port 8000
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
      - name: Start it, ask it, check it
        shell: pwsh
        run: |
          $themis = "$env:RUNNER_TEMP\Themis\bin\themis.cmd"
          & $themis status
          Start-Process -FilePath cmd.exe -ArgumentList "/c", "`"$themis`" run" -WindowStyle Hidden
          $up = $false
          foreach ($i in 1..40) { try { $r = Invoke-RestMethod http://127.0.0.1:8000/api/health; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { throw "Themis did not answer" }
          $r
          Invoke-RestMethod http://127.0.0.1:8000/api/version
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/).Content -match "<html"
          & $themis doctor
          & $themis backup
      - name: Register the scheduled task (what the real service is; may not work on a CI runner)
        shell: pwsh
        continue-on-error: true
        run: |
          python scripts/themisctl.py --home "$env:RUNNER_TEMP\Themis" stop 2>$null
          $bundle = (Get-ChildItem dist\themisforge-*.tar.gz).FullName
          python scripts/themisctl.py --home "$env:RUNNER_TEMP\Themis" install --bundle $bundle --skip-image --yes --port 8001
          & "$env:RUNNER_TEMP\Themis\bin\themis.cmd" status
          schtasks /Query /TN Themis /XML
          & "$env:RUNNER_TEMP\Themis\bin\themis.cmd" uninstall
